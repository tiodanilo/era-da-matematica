<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Era da Matemática — Vila do Egito</title>
<link rel="stylesheet" href="estilo.css">
<style>
.tela{display:grid;grid-template-columns:1fr 340px}
#cena{position:relative;min-width:0}
#arvore{background:var(--papiro);border-left:3px solid var(--borda);overflow:auto;padding:14px 16px}
#arvore h2{margin:0;font-size:20px}
#arvore .sub{margin:2px 0 12px;font-size:14px}
.no{position:relative;display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;border:2px solid var(--borda);background:#f7ead0;margin-bottom:18px;cursor:default}
.no:not(:last-child)::after{content:"";position:absolute;left:28px;bottom:-20px;height:18px;border-left:3px solid #b39a6a}
.no .ic{flex:0 0 36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;background:#d8c08a;color:#7a6440;border:2px solid var(--borda)}
.no h3{margin:0;font-size:16px}
.no p{margin:2px 0 0;font-size:13px;line-height:1.35}
.no .premio{font-size:12px;color:#6d5430;margin-top:4px}
.no.feito .ic{background:var(--verde);color:#fff;border-color:#2c5a18}
.no.aberto{background:#fff3cf;border-color:var(--ouro);cursor:pointer;animation:brilho 1.2s ease-in-out infinite alternate}
.no.aberto .ic{background:var(--ouro);color:#fff}
.no.feito{cursor:pointer}
.no.bloq{opacity:.6}
.no:focus-visible{outline:3px solid var(--azul)}
@media (max-width:820px){.tela{grid-template-columns:1fr;grid-template-rows:55vh 45vh}#arvore{border-left:0;border-top:3px solid var(--borda)}}
</style>
</head>
<body>
<div class="tela">
  <div id="cena">
    <canvas id="tela"></canvas>
    <div class="hud">
      <div class="painel num"><span>🌴 Vila às margens do Nilo</span></div>
      <button class="sec direita" id="b-som">🔊 Som</button>
      <button class="sec" id="b-mapa">🗺 Mapa do mundo</button>
    </div>
    <div class="painel fala" id="fala"><span class="quem"></span><span class="txt"></span></div>
  </div>
  <aside id="arvore" aria-label="Árvore do conhecimento do Egito">
    <h2>Árvore do conhecimento</h2>
    <p class="sub">Cada conhecimento aprendido vira uma construção na vila.</p>
    <div id="nos"></div>
  </aside>
</div>
<script src="comum.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const prog = lerProgresso();
const NOS = [
  {id:'numeros', titulo:'Os números do Egito', tema:'Sistema de numeração egípcio', premio:'Constrói o celeiro', pagina:'numeros.html'},
  {id:'terrenos', titulo:'Os terrenos da cheia', tema:'Área e perímetro', premio:'Constrói os campos de trigo e a casa de Ipi', pagina:'terrenos.html', requer:'numeros'},
  {id:'figuras', titulo:'Terrenos em L', tema:'Figuras compostas', premio:'Constrói o templo', requer:'terrenos', breve:true},
  {id:'paes', titulo:'Dividir os pães', tema:'Frações', premio:'Constrói a padaria', requer:'figuras', breve:true},
  {id:'silo', titulo:'Quanto cabe no silo?', tema:'Volume', premio:'Silos grandes', requer:'paes', breve:true},
  {id:'enigma', titulo:'O enigma do escriba', tema:'Equações simples', premio:'Abre a rota para a Babilônia', requer:'silo', breve:true}
];
function renderArvore(){
  $('nos').innerHTML = NOS.map(n=>{
    const feito=!!prog[n.id], liberado=!n.breve && (!n.requer || prog[n.requer]);
    const cls = feito?'feito':liberado?'aberto':'bloq';
    const ic = feito?'✓':liberado?'▶':'🔒';
    const extra = n.breve ? ' <small>(em breve)</small>' : '';
    return `<div class="no ${cls}" data-id="${n.id}" ${feito||liberado?'tabindex="0" role="button"':''}>
      <div class="ic">${ic}</div><div><h3>${n.titulo}${extra}</h3><p>${n.tema}</p><div class="premio">${feito?'Construído: ':'Prêmio: '}${n.premio.replace(/^Constrói /,'')}</div></div></div>`;
  }).join('');
  document.querySelectorAll('.no').forEach(el=>{
    const n=NOS.find(x=>x.id===el.dataset.id), ok=!n.breve&&(prog[n.id]||!n.requer||prog[n.requer]);
    const ir=()=>{ Som.tocar('clique'); if(ok) setTimeout(()=>location.href=n.pagina,120); else if(n.breve) falar('Escriba','Esse conhecimento ainda está sendo preparado. Em breve!'); else falar('Escriba','Primeiro aprenda o conhecimento anterior da árvore.'); };
    el.onclick=ir; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' ') ir(); };
  });
}
let timerFala=null;
function falar(quem,txt,seg=8){ const f=$('fala'); f.querySelector('.quem').textContent=quem; f.querySelector('.txt').innerHTML=txt; f.style.display='block'; clearTimeout(timerFala); timerFala=setTimeout(()=>f.style.display='none',seg*1000); }
$('b-mapa').onclick=()=>location.href='index.html#mapa';
botaoSom($('b-som'));
document.addEventListener('pointerdown',()=>Som.musica(true),{once:true});

/* ===== Vila ===== */
const cena = new Cena($('tela'), 14, 70);
const N = 14;
const tipo = (x,y)=> y<2?'agua': y===2?'margem':'areia';
const novo = new URLSearchParams(location.search).get('novo');
const celeiro = {x:3, y:10, w:2, d:2, prog: prog.numeros ? (novo==='numeros'?0.01:1) : 0};
const cabana = {x:8, y:9, w:2, d:2};
const casaIpi = {x:11, y:6, w:2, d:2, prog: prog.terrenos ? (novo==='terrenos'?0.01:1) : 0};
const campos = [{x:2,y:4,w:5,d:5},{x:8,y:3,w:3,d:3}];
const palmeiras = [{x:1.5,y:13},{x:6,y:12.8},{x:12.5,y:11.5},{x:13,y:9},{x:7.3,y:3.6}];
const moradores = [{x:9,y:12,dest:null},{x:6,y:10,dest:null}];
if(prog.terrenos) moradores.push({x:11,y:9,dest:null});
function passear(m,dt){
  if(!m.dest||m.pausa>0){ m.pausa=(m.pausa||0)-dt; if(m.pausa<=0&&!m.dest){ m.dest=[2+Math.random()*10, 9.5+Math.random()*3.5]; } return; }
  if(moverPara(m,m.dest[0],m.dest[1],1.2,dt)){ m.dest=null; m.pausa=1+Math.random()*3; m.andando=false; }
}
let ultimo=performance.now();
function quadro(agora){
  const dt=Math.max(0,Math.min(0.1,(agora-ultimo)/1000)); ultimo=Math.max(ultimo,agora);
  for(const [b,cx,cy] of [[celeiro,celeiro.x+1,celeiro.y+1],[casaIpi,casaIpi.x+1,casaIpi.y+1]]) if(b.prog>0&&b.prog<1){
    b.prog=Math.min(1,b.prog+dt/2.5); if(Math.random()<dt*6) cena.emitir(cx,cy,'poeira',2); if(b.prog>=1) cena.emitir(cx,cy,'brilho',24); }
  cena.comecar(dt);
  cena.chao(tipo);
  if(prog.terrenos) campos.forEach(c=>cena.campo(c,1,true));
  else { cena.contorno(campos[0],'rgba(120,80,40,.35)',2,[6,5]); }
  const ents=[{d:cabana.x+cabana.y+2,f:()=>cena.cabana(cabana)}];
  if(celeiro.prog>0) ents.push({d:celeiro.x+celeiro.y+2,f:()=>cena.celeiro(celeiro,celeiro.prog)});
  else ents.push({d:-1,f:()=>cena.contorno(celeiro,'rgba(120,80,40,.5)',2,[6,5])});
  if(casaIpi.prog>0) ents.push({d:casaIpi.x+casaIpi.y+2,f:()=>{ const k=casaIpi.prog; if(k<1){ cena.caixa(casaIpi,32*k,['#d4b282','#b08e5e','#ead5aa']); } else cena.cabana(casaIpi); }});
  for(const p of palmeiras) ents.push({d:p.x+p.y,f:()=>cena.palmeira(p)});
  for(const m of moradores){ passear(m,dt); ents.push({d:m.x+m.y,f:()=>cena.pessoa(m,'#f4efe2')}); }
  ents.sort((a,b)=>a.d-b.d).forEach(e=>e.f());
  if(!prog.numeros) cena.seta(celeiro.x+1,celeiro.y+1,24);
  cena.desenharFlutuantes(); cena.vinheta();
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
renderArvore();
if(novo==='numeros') falar('Escriba','Você aprendeu os números do Egito, e o celeiro foi construído! Agora a vila está pronta para medir os terrenos depois da cheia.',10);
else if(novo==='terrenos') falar('Escriba','Os campos de trigo e a casa da família de Ipi agora fazem parte da vila!',10);
else if(!prog.numeros) falar('Escriba','Bem-vindo ao Egito! Cada conhecimento que você aprender vira uma construção aqui na vila. Comece pelos <b>números do Egito</b>, na árvore do conhecimento.',12);
</script>
</body>
</html>
